<svg fill="none" viewBox="0 0 800 250" width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Segoe UI', sans-serif;
        }

        .card {
          width: 800px;
          height: 250px;
          overflow: hidden;
          position: relative;
          background: #090b10;
          border: 4px solid #00f0ff;
        }

        .card::before {
          content: "";
          position: absolute;
          inset: -50%;
          background:
            conic-gradient(
              #00f0ff,
              #7b61ff,
              #ff3cac,
              #00f0ff
            );
          animation: rotate 6s linear infinite;
        }

        .inner {
          position: absolute;
          inset: 4px;
          background:
            radial-gradient(circle at center,
            rgba(123,97,255,0.15),
            #090b10 70%);
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          color: white;
          overflow: hidden;
        }

        .clock {
          position: absolute;
          width: 500px;
          height: 500px;
          border: 1px solid rgba(0,240,255,.08);
          border-radius: 50%;
          animation: spin 30s linear infinite;
        }

        .clock::before,
        .clock::after {
          content: "";
          position: absolute;
          inset: 50%;
          background: rgba(0,240,255,.15);
          transform-origin: top;
        }

        .clock::before {
          width: 2px;
          height: 180px;
        }

        .clock::after {
          width: 180px;
          height: 2px;
          margin-top: -1px;
        }

        .title {
          position: relative;
          font-size: 42px;
          font-weight: 900;
          letter-spacing: 4px;
          color: #ffffff;
          text-transform: uppercase;
          animation: glitch 4s infinite;
          z-index: 2;
        }

        .subtitle {
          color: #00f0ff;
          margin-top: 8px;
          font-size: 14px;
          letter-spacing: 3px;
          text-transform: uppercase;
          z-index: 2;
        }

        .desc {
          margin-top: 12px;
          color: #c7d0e0;
          font-size: 14px;
          text-align: center;
          max-width: 600px;
          z-index: 2;
        }

        .button {
          margin-top: 20px;
          padding: 12px 30px;
          border: 2px solid #00f0ff;
          color: #00f0ff;
          text-decoration: none;
          font-weight: bold;
          letter-spacing: 2px;
          transition: all .3s ease;
          z-index: 2;
        }

        .button:hover {
          background: #00f0ff;
          color: #090b10;
        }

        .team {
          position: absolute;
          bottom: 15px;
          right: 20px;
          color: #888;
          font-size: 12px;
          letter-spacing: 2px;
        }

        @keyframes rotate {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(-360deg); }
        }

        @keyframes glitch {
          0%,100% {
            text-shadow:
              2px 0 #00f0ff,
              -2px 0 #ff3cac;
          }
          25% {
            text-shadow:
              -2px 0 #00f0ff,
              2px 0 #ff3cac;
          }
          50% {
            text-shadow:
              4px 0 #00f0ff,
              -4px 0 #ff3cac;
          }
          75% {
            text-shadow:
              -4px 0 #00f0ff,
              4px 0 #ff3cac;
          }
        }
      </style>

      <div class="card">
        <div class="inner">

          <div class="clock"></div>

          <div class="title">
            CHRONO DECEPTION
          </div>

          <div class="subtitle">
            TIME IS LYING TO YOU
          </div>

          <div class="desc">
            Uncover hidden truths, manipulate time,
            and escape a reality built on deception.
          </div>

          <a class="button"
             href="https://myztyn.itch.io/chrono-deception" target="_blank">
             ▶ PLAY ON ITCH.IO
          </a>

          <div class="team">
            A.K.A OWLS STUDIO
          </div>

        </div>
      </div>
    </div>
  </foreignObject>
</svg>