<svg fill="none" viewBox="0 0 800 250" width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Segoe UI', sans-serif;
        }

        .card {
          width: 800px;
          height: 250px;
          position: relative;
          background: linear-gradient(135deg, #0d0214 0%, #1a0a2e 50%, #0d0214 100%);
          overflow: hidden;
          display: flex;
          align-items: center;
        }

        .grid-lines {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(255,60,172,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,60,172,0.06) 1px, transparent 1px);
          background-size: 30px 30px;
        }

        .glow-orb {
          position: absolute;
          width: 350px;
          height: 350px;
          right: -100px;
          top: -80px;
          background: radial-gradient(circle, rgba(255,60,172,0.35), transparent 70%);
          filter: blur(20px);
          animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.6; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.1); }
        }

        .accent-bar {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 6px;
          background: linear-gradient(180deg, #ff3cac, #7b61ff, #00f0ff);
        }

        .content {
          position: relative;
          z-index: 2;
          padding: 0 50px;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }

        .tag {
          color: #ff3cac;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 4px;
          text-transform: uppercase;
          padding: 4px 12px;
          border: 1px solid rgba(255,60,172,0.5);
          border-radius: 20px;
          margin-bottom: 14px;
        }

        .title {
          font-size: 44px;
          font-weight: 800;
          letter-spacing: 1px;
          color: #ffffff;
          line-height: 1.1;
        }

        .title span {
          background: linear-gradient(90deg, #ff3cac, #7b61ff);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }

        .desc {
          margin-top: 10px;
          color: #b8b0c8;
          font-size: 14px;
          max-width: 480px;
        }

        .row {
          margin-top: 22px;
          display: flex;
          align-items: center;
          gap: 24px;
        }

        .button {
          padding: 12px 28px;
          background: linear-gradient(90deg, #ff3cac, #7b61ff);
          color: #ffffff;
          text-decoration: none;
          font-weight: bold;
          font-size: 13px;
          letter-spacing: 2px;
          border-radius: 6px;
          box-shadow: 0 4px 18px rgba(255,60,172,0.4);
          transition: transform .25s ease, box-shadow .25s ease;
        }

        .button:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 22px rgba(255,60,172,0.6);
        }

        .team {
          color: #6b6480;
          font-size: 11px;
          letter-spacing: 2px;
        }
      </style>

      <div class="card">
        <div class="grid-lines"></div>
        <div class="glow-orb"></div>
        <div class="accent-bar"></div>

        <div class="content">
          <div class="tag">Mystery</div>

          <div class="title">CHRONO <span>DECEPTION</span></div>

          <div class="desc">
            Uncover hidden truths, manipulate time, and escape a reality built on deception.
          </div>

          <div class="row">
            <a class="button" href="https://myztyn.itch.io/chrono-deception" target="_blank">
              ▶ PLAY ON ITCH.IO
            </a>
            <div class="team">A.K.A OWLS STUDIO</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>